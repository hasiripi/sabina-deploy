# =====================================================================
# GEO: LLM MANIFEST DISCOVERY BLOGU (2026-07-06)
# ---------------------------------------------------------------------
# Bu blok CANLI sunucudaki .htaccess dosyasina EKLENECEK; dosyanin
# tamamini degistirmeyin. Canli .htaccess SSR routing (ssr.php) kurallari
# iceriyor olabilir — bu depodaki eski kopyada o kurallar yok, o yuzden
# tam dosya yerine sadece bu blok veriliyor.
#
# Nereye: mevcut "SECURITY HEADERS" <IfModule mod_headers.c> blogunun
# disina, ayri bir blok olarak eklenmesi yeterli. LiteSpeed/Apache
# ikisinde de calisir.
#
# Ne yapar:
# 1. index.html uzerinden donen tum SPA sayfalarina (ana sayfa dahil)
#    llms.txt / llms-full.txt / ai.txt discovery Link header'i ekler.
#    SSR sayfalari (methodology, news, longevity/*) bu header'i zaten
#    ssr.php icinden gonderiyor (kaynak repoda uygulandi).
# 2. LLM manifest dosyalarinin 1 saatten uzun cache'lenmemesini saglar,
#    boylece guncellemeler AI crawler'lara hizli yansir.
# =====================================================================

# ===== GEO: LLM MANIFEST DISCOVERY (2026-07-06) =====
<IfModule mod_headers.c>
    <FilesMatch "^index\.html$">
        Header set Link "<https://sabinamalikova.com/llms.txt>; rel=\"llms\", <https://sabinamalikova.com/llms-full.txt>; rel=\"llms-full\", <https://sabinamalikova.com/.well-known/ai.txt>; rel=\"ai-policy\""
    </FilesMatch>

    <FilesMatch "^(llms\.txt|llms-full\.txt|ai\.txt|sources\.json)$">
        Header set Cache-Control "max-age=3600"
    </FilesMatch>
</IfModule>
